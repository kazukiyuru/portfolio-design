<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません | 高尾一輝 ポートフォリオ</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/kazu_ai.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --text: #3D2B1F;
    --sub: #6E5A47;
    --accent: #8B6F47;
    --border: #E8DDD4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif JP', serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 56px 40px; max-width: 420px;
  }
  .code { font-size: 0.85rem; color: var(--accent); letter-spacing: 0.15em; margin-bottom: 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 16px; }
  p { font-size: 0.9rem; color: var(--sub); line-height: 1.9; margin-bottom: 32px; }
  a.home-link {
    display: inline-block;
    background: var(--accent); color: #fff;
    border-radius: 30px; padding: 12px 32px;
    font-size: 0.9rem; text-decoration: none;
    transition: opacity 0.2s;
  }
  a.home-link:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動したか、存在しない可能性があります。</p>
    <a class="home-link" href="/">トップページへ戻る</a>
  </div>
</body>
</html>
